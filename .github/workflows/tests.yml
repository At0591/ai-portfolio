name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  sales-agent:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 01-ai-sales-agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: 01-ai-sales-agent/requirements.txt
      - run: pip install -r requirements.txt pytest
      - run: python -m pytest -q

  menu-assistant:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 02-dbr-menu-assistant
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: 02-dbr-menu-assistant/requirements.txt
      - run: pip install -r requirements.txt pytest
      - run: python -m pytest -q
