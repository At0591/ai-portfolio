# House rules for public writing: British English, sentence case, plain words, no contractions.
# Run "vale sync" once to download the ai-tells package.
StylesPath = styles
MinAlertLevel = warning
Vocab = Akshay
Packages = https://github.com/tbhb/vale-ai-tells/releases/download/v1.37.0/ai-tells.zip

[*.{md,html}]
BasedOnStyles = Vale, Akshay
# Spelling and grammar come from LanguageTool (grammar.py), not Vale.
Vale.Spelling = NO
# Grade and rhythm scores flagged good sentences more often than bad ones.
Akshay.ReadingGrade = NO
Akshay.ShortSentences = NO
# The few AI tells a reader actually notices.
ai-tells.EmDashUsage = YES
ai-tells.ClosingPleasantries = YES
ai-tells.FillerPhrases = YES
ai-tells.OverusedVocabulary = YES
# Professional voice: no contractions.
AkshayPro.Contractions = YES
